services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/app.db
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:3000:3000"

  # Reverse proxy con HTTPS automatico (Let's Encrypt). Imposta il dominio in Caddyfile.
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  caddy_data:
